spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${SPRING_DATASOURCE_USERNAME:embarkx}
    password: ${SPRING_DATASOURCE_PASSWORD:embarkx}
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
  database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082